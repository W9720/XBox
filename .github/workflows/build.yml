name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macOS runner 在该账号下不可用；Ubuntu 源里没有 ldid，改为源码编译
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make xz-utils fakeroot pkg-config \
            libssl-dev libplist-dev libc6-dev zlib1g-dev

      - name: 编译安装 ldid
        run: |
          git clone --depth=1 --recursive https://github.com/ProcursusTeam/ldid.git "$HOME/ldid-src"
          cd "$HOME/ldid-src"
          make -j"$(nproc)"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v || true

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          chmod +x "$HOME/theos/bin/"*

      - name: 编译打包（正式版，无debug）
        run: |
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error
