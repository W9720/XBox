name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 账号不支持 arm64 runner，固定使用 Intel 的 macos-13
    runs-on: macos-13
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装完整Theos环境
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          brew install ldid xz make
          chmod +x "$HOME/theos/bin/"*

      - name: 编译打包（正式版，无debug）
        run: |
          MAKE_BIN="$(command -v gmake || command -v make)"
          echo "using $MAKE_BIN"
          "$MAKE_BIN" clean 2>/dev/null || true
          "$MAKE_BIN" package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error
