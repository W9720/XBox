name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make xz-utils fakeroot pkg-config \
            libssl-dev libplist-dev libc6-dev zlib1g-dev

      - name: 编译安装 ldid
        run: |
          git clone --depth=1 --recursive https://github.com/ProcursusTeam/ldid.git "$HOME/ldid-src"
          cd "$HOME/ldid-src"
          make -j"$(nproc)"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v || true

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          chmod +x "$HOME/theos/bin/"*
          # Linux 下 Theos 需要 toolchain/linux/iphone/bin/*，逐项指向系统工具
          # 关键：ld 必须是 Mach-O 链接器 ld64.lld，不能是 GNU ld
          TC="$HOME/theos/toolchain/linux/iphone"
          mkdir -p "$TC/bin"
          if [ ! -e /usr/bin/ld64.lld ]; then
            src="$(ls /usr/bin/ld64.lld-* 2>/dev/null | head -1)"
            if [ -n "$src" ]; then sudo ln -sfn "$src" /usr/bin/ld64.lld; fi
          fi
          if [ ! -e /usr/bin/llvm-strip ]; then
            src="$(ls /usr/bin/llvm-strip-* 2>/dev/null | head -1)"
            if [ -n "$src" ]; then sudo ln -sfn "$src" /usr/bin/llvm-strip; fi
          fi
          ln -sfn /usr/bin/clang "$TC/bin/clang"
          ln -sfn /usr/bin/clang++ "$TC/bin/clang++"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64.lld"
          ln -sfn /usr/bin/llvm-strip "$TC/bin/strip"
          # 让 clang 在 PATH 中优先找到 Mach-O 版 ld
          echo "$TC/bin" >> "$GITHUB_PATH"
          ls -l "$TC/bin"

      - name: 环境自检
        run: |
          echo "--- clang"; clang --version | head -3
          echo "--- ld"; command -v ld; readlink -f "$(command -v ld)" || true
          echo "--- ld64.lld"; which ld64.lld && ld64.lld --version | head -2
          echo "--- ldid"; ldid -v || true
          echo "--- dpkg-deb"; dpkg-deb --version | head -1
          echo "--- sdks"; ls "$THEOS/sdks"
          echo "--- theos"; ls "$THEOS" | head

      - name: 编译打包（正式版，无debug）
        run: |
          set -euo pipefail
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          echo "--- generated packages:"
          ls -l packages/ || true

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 失败时把日志推到 ci-log 分支
        if: failure()
        run: |
          cp build.log build-failure.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B ci-log
          git add -f build-failure.log
          git commit -m "ci: failure log" || true
          git push -f origin ci-log || true
