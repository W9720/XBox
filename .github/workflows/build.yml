name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macOS runner 在该账号下不可用（一直 Waiting for a runner），改用 Linux 编译
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make ldid xz-utils fakeroot \
            libssl-dev libplist-dev libc6-dev libstdc++-12-dev

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          chmod +x "$HOME/theos/bin/"*

      - name: 编译打包（正式版，无debug）
        run: |
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error
