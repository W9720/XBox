name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make xz-utils fakeroot pkg-config \
            libssl-dev libplist-dev libc6-dev zlib1g-dev

      - name: 编译安装 ldid
        run: |
          git clone --depth=1 --recursive https://github.com/ProcursusTeam/ldid.git "$HOME/ldid-src"
          cd "$HOME/ldid-src"
          make -j"$(nproc)"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v || true

      - name: 安装 Theos 与 iOS SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          chmod +x "$HOME/theos/bin/"*
          # Linux 下 Theos 需要 toolchain/linux/iphone/bin/*，逐项指向系统工具
          # 关键：ld 必须指向 Mach-O 链接器 ld64.lld，不能是 GNU ld
          TC="$HOME/theos/toolchain/linux/iphone"
          mkdir -p "$TC/bin"
          ln -sfn /usr/bin/clang "$TC/bin/clang"
          ln -sfn /usr/bin/clang++ "$TC/bin/clang++"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64.lld"
          for t in llvm-strip:strip llvm-objcopy:objcopy llvm-install-name-tool:install_name_tool; do
            src_name="${t%%:*}"; dst_name="${t##*:}"
            src="$(command -v "$src_name" || true)"
            if [ -z "$src" ]; then src="$(ls /usr/bin/${src_name}-* 2>/dev/null | head -1)"; fi
            if [ -n "$src" ]; then ln -sfn "$src" "$TC/bin/$dst_name"; fi
          done
          ls -l "$TC/bin"

      - name: 环境自检
        run: |
          echo "--- clang"; clang --version | head -3
          echo "--- ld64.lld"; which ld64.lld && ld64.lld --version | head -2
          echo "--- ldid"; ldid -v || true
          echo "--- dpkg-deb"; dpkg-deb --version | head -1
          echo "--- sdks"; ls "$THEOS/sdks"
          echo "--- theos"; ls "$THEOS" | head

      - name: 编译打包（正式版，无debug）
        run: |
          set -euo pipefail
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          echo "--- generated packages:"
          ls -l packages/ || true

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
