name: 打包无根越狱deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make xz-utils fakeroot pkg-config \
            libssl-dev libplist-dev libc6-dev zlib1g-dev
          # lld 是多调用二进制：必须以 "ld64.lld" 的名字执行才是 Mach-O 链接器
          if [ ! -e /usr/bin/ld64.lld ]; then
            for c in /usr/bin/ld64.lld-* /usr/bin/lld-*; do
              if [ -e "$c" ]; then sudo ln -sfn "$c" /usr/bin/ld64.lld; break; fi
            done
          fi
          if [ ! -e /usr/bin/llvm-strip ]; then
            for c in /usr/bin/llvm-strip-*; do
              if [ -e "$c" ]; then sudo ln -sfn "$c" /usr/bin/llvm-strip; break; fi
            done
          fi
          test -e /usr/bin/ld64.lld
          /usr/bin/ld64.lld --version | head -2

      - name: 编译安装 ldid
        run: |
          set -e
          git clone --depth=1 --recursive https://github.com/ProcursusTeam/ldid.git "$HOME/ldid-src"
          cd "$HOME/ldid-src"
          make -j"$(nproc)"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v || true

      - name: 安装 Theos 与 iOS SDK
        run: |
          set -e
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-src/"*.sdk "$HOME/theos/sdks/"
          chmod +x "$HOME/theos/bin/"*

          TC="$HOME/theos/toolchain/linux/iphone"
          mkdir -p "$TC/bin"
          ln -sfn /usr/bin/clang "$TC/bin/clang"
          ln -sfn /usr/bin/clang++ "$TC/bin/clang++"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64"
          ln -sfn /usr/bin/ld64.lld "$TC/bin/ld64.lld"
          ln -sfn /usr/bin/llvm-strip "$TC/bin/strip"

          # 关键：不能把链接器直接命名为 "ld"。
          # lld 依据 argv[0] 选择 flavor，名为 "ld" 时会进入 GNU/ELF 模式，
          # 于是 Darwin 参数（-dynamic/-dylib/-arch/-framework...）全部报 unknown argument。
          # 用包装脚本强制以 ld64.lld 身份执行，确保走 Mach-O 模式。
          printf '#!/bin/sh\nexec /usr/bin/ld64.lld "$@"\n' > "$TC/bin/ld"
          chmod +x "$TC/bin/ld"
          # 全局兜底：Theos 若直接取 PATH 中的 ld，也命中 Mach-O 链接器
          printf '#!/bin/sh\nexec /usr/bin/ld64.lld "$@"\n' | sudo tee /usr/local/bin/ld >/dev/null
          sudo chmod +x /usr/local/bin/ld

          echo "$TC/bin" >> "$GITHUB_PATH"
          ls -l "$TC/bin"

      - name: 链接器冒烟测试
        run: |
          set -euo pipefail
          export PATH="$HOME/theos/toolchain/linux/iphone/bin:$PATH"
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          printf 'int xbe_probe(void){return 0;}\n' > /tmp/probe.c
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -c /tmp/probe.c -o /tmp/probe.o
          ld -arch arm64 -dylib -platform_version ios 15.0 16.5 -syslibroot "$SDK" \
             -o /tmp/probe.dylib /tmp/probe.o -L"$SDK/usr/lib" -lSystem
          file /tmp/probe.dylib
          echo "链接器冒烟测试通过"

      - name: 环境自检
        run: |
          echo "--- clang"; clang --version | head -3
          echo "--- ld"; command -v ld; head -2 "$(command -v ld)" 2>/dev/null || true
          echo "--- ld64.lld"; /usr/bin/ld64.lld --version | head -2
          echo "--- ldid"; ldid -v || true
          echo "--- dpkg-deb"; dpkg-deb --version | head -1
          echo "--- sdks"; ls "$THEOS/sdks"

      - name: 编译打包（正式版，无debug）
        run: |
          set -euo pipefail
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          echo "--- generated packages:"
          ls -l packages/

      - name: 上传deb文件
        uses: actions/upload-artifact@v4
        with:
          name: Deb-Package
          path: packages/*.deb
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
